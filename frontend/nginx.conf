server {
    listen 3000;
    root /usr/share/nginx/html;

    # API requests go to the FastAPI container.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
    }

    # Everything else is the Angular app.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
