services:
  postgres:
    image: postgres:17
    container_name: tmc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tmc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tmc_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-taipei_movies}
      TZ: Asia/Taipei
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tmc} -d ${POSTGRES_DB:-taipei_movies}"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: tmc-pgadmin
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin_dev_password}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "127.0.0.1:${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./docker/pgadmin-servers.json:/pgadmin4/servers.json:ro

  # Python API. Only reachable from the other containers.
  api:
    build: ./backend
    container_name: tmc-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-tmc}:${POSTGRES_PASSWORD:-tmc_dev_password}@postgres:5432/${POSTGRES_DB:-taipei_movies}
      TZ: Asia/Taipei

  # Angular app served by nginx, which also forwards /api to the API.
  # `docker compose up -d --build web`
  web:
    build: ./frontend
    container_name: tmc-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"

  # Optional public access via Cloudflare Tunnel (needs CLOUDFLARE_TUNNEL_TOKEN in .env).
  #   docker compose --profile tunnel up -d
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: tmc-cloudflared
    restart: unless-stopped
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - web

volumes:
  pgdata:
  pgadmin_data:
